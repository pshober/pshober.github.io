# "From the field" media wall on the home page (rendered by _layouts/home.html).
# type: video | image | link. Credits live here so they can never be dropped
# when reshuffling tiles.
- type: video
  src: /assets/video/winchcombe-allsky.mp4
  poster: /assets/img/media/winchcombe-poster.webp
  preload: metadata
  title: "The Winchcombe fireball"
  meta: "All-sky camera view of the 2021 UK meteorite fall"
  alt: "Looping all-sky video of the Winchcombe fireball fragmenting"
  credit: "Video: UK Fireball Alliance"

# NOTE: Patrick is not in any of the field-recovery photos — he worked on the
# papers behind these campaigns. Captions must describe the campaign, never
# imply a personal find.
- type: image
  src: /assets/img/media/recovery-outback-thumb.webp
  full: /assets/img/media/recovery-outback.webp
  title: "Fresh from the sky"
  meta: "A DFN team recovers a newly fallen meteorite in the Australian outback"
  alt: "Two researchers kneeling beside a freshly recovered meteorite in the outback"
  credit: "Photo: Desert Fireball Network, Curtin University"

- type: video
  src: /assets/video/stream-topdown.mp4
  poster: /assets/img/media/stream-poster.webp
  preload: none
  title: "M2026-A1, a newly confirmed meteor stream"
  meta: "282 meteors from a stream shed by a disintegrating asteroid"
  alt: "Animation of the M2026-A1 meteoroid stream orbiting through the inner solar system"
  credit: "Animation: Shober 2026, ApJ"

- type: image
  src: /assets/img/media/fripon-summit-thumb.webp
  full: /assets/img/media/fripon-summit.webp
  title: "Eyes on the sky"
  meta: "A FRIPON all-sky camera above the clouds at blue hour"
  alt: "Gold FRIPON all-sky camera on a snowy mountain summit at dusk"
  credit: "Photo: FRIPON / Vigie-Ciel"

- type: image
  src: /assets/img/media/drone-search-thumb.webp
  full: /assets/img/media/drone-search.webp
  title: "Searching from above"
  meta: "Drone-assisted searching on a DFN strewn field"
  alt: "Drone view looking straight down at a researcher on an outback track"
  credit: "Photo: Desert Fireball Network, Curtin University"

