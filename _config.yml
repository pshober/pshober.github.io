# ── Site settings ───────────────────────────────────────────────────────────
title: Patrick M. Shober
tagline: "Planetary scientist: meteorites, fireballs & radar detection"
description: >-
  Patrick M. Shober, NASA Postdoctoral Fellow at Johnson Space Center.
  Automatic detection of meteorite falls in NEXRAD Doppler weather radar
  (MetDetect), fireball dynamics, and the meteorite–asteroid connection.
url: "https://planetarypat.com"
# baseurl intentionally omitted; this is a user site served at the domain root.

author:
  name: Patrick M. Shober
  email: planetarypat@gmail.com
  orcid: "0000-0003-4766-2098"
  github: pshober
  affiliation: "ARES Division, NASA Johnson Space Center"

# Social-share card (used by jekyll-seo-tag for og:image / twitter:image)
image: /assets/img/og-card.jpg
twitter:
  card: summary_large_image

# Social / identity links surfaced in the footer and SEO metadata.
links:
  email: "mailto:planetarypat@gmail.com"
  orcid: "https://orcid.org/0000-0003-4766-2098"
  # TODO: replace with your Google Scholar profile URL; this is a name-search fallback
  scholar: "https://scholar.google.com/scholar?q=Patrick+M.+Shober"
  github: "https://github.com/pshober"

# Visual identity: logo, palette, type and the page designs this site is built from.
design:
  name: "Audrey Lisador"
  url: "https://www.linkedin.com/in/audrey-lisador/"

# ── Build ───────────────────────────────────────────────────────────────────
# We ship our own layouts/includes/sass, so no gem theme.
theme: null

# Only GitHub-Pages-whitelisted plugins (native build, no Actions required).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# One page per meteorite fall (_falls/<slug>.md) at /meteorite-falls/<slug>/.
# Hand-maintained facts live in those files; MetDetect results are generated into _data/metdetect.yml.
collections:
  falls:
    output: true
    permalink: /meteorite-falls/:name/

# Default layout for any page that doesn't set one.
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: falls
    values:
      layout: fall

# "Ask about a fireball" form on /meteorite-falls/.
# endpoint empty: the form opens the visitor's own email app with the message filled in (nothing is stored
# anywhere). To receive inquiries directly instead, create a free form at https://formspree.io (sign in with
# the address below) and paste its endpoint, e.g. "https://formspree.io/f/abcdwxyz".
falls_inquiry:
  endpoint: ""
  email: planetarypat@gmail.com

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore
  - scripts

# /metdetect-demo/ is temporarily offline (its page has `published: false`); every link to it is hidden unless this is true.
metdetect_demo_live: false
