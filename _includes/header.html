{% assign url = page.url %}
<header class="site-header">
  <nav class="nav container" aria-label="Primary">
    <a class="nav__brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/brand/logo-purple.webp' | relative_url }}"
           alt="Planetary Pat — Patrick M. Shober, home" width="172" height="96">
    </a>
    <ul class="nav__links">
      <li><a href="{{ '/' | relative_url }}"            {% if url == '/' %}class="is-active" aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{{ '/research/' | relative_url }}"    {% if url contains '/research' %}class="is-active" aria-current="page"{% endif %}>Research</a></li>
      <li><a href="{{ '/publications/' | relative_url }}"{% if url contains '/publications' %}class="is-active" aria-current="page"{% endif %}>Publications</a></li>
      <li><a href="{{ '/cv/' | relative_url }}"          {% if url contains '/cv' %}class="is-active" aria-current="page"{% endif %}>CV</a></li>
    </ul>
  </nav>
</header>
